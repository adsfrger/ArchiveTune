name: Build Clone ArchiveTune

on:
  # フォーク元から「Sync fork」した時（mainブランチへのプッシュ）に自動実行
  push:
    branches: [ "main", "master" ]
  # 手動で実行するためのトリガー
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Rewrite applicationId and App Name
      run: |
        # 1. build.gradle(.kts) 内の applicationId を検索して末尾に ".clone" を追加する
        # ※記述形式（Kotlin DSLかGroovyか）に合わせて両方対応
        find . -name "build.gradle*" -exec sed -i 's/applicationId = "/applicationId = "/g' {} +
        find . -name "build.gradle*" -exec sed -i 's/applicationId "/applicationId "/g' {} +
        
        # 具体的なパッケージ名がわかる場合は直接置換が確実です（例）
        find . -name "build.gradle*" -exec sed -i 's/io.github.rukamori.archivetune/io.github.rukamori.archivetune.clone/g' {} +

        # 2. アプリ名を変更して、本家と見分けがつくようにする
        find . -name "strings.xml" -exec sed -i 's/>ArchiveTune</>ArchiveTune Clone</g' {} +

    - name: Make gradlew executable
      run: chmod +x ./gradlew

    - name: Build Debug APK
      run: ./gradlew assembleDebug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: ArchiveTune-Clone-APK
        path: app/build/outputs/apk/debug/*.apk
